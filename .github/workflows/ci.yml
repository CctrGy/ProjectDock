name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-build.txt
      - run: python -m pytest -q
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./build.ps1 -Release
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectDock-windows
          path: dist/ProjectDock/
