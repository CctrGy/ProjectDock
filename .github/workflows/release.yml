name: Publish Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.1
        required: true
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-build.txt
      - run: python -m pytest -q
  publish:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid tag' }
          $version = [regex]::Match((Get-Content src/projectdock/__init__.py -Raw), '__version__ = "([^"]+)"').Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag/version mismatch' }
          ./build.ps1 -Release
          ./scripts/package-release.ps1
          ./scripts/test-installer.ps1 -Installer "dist/release/ProjectDock-$version-windows-x64-setup.exe"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; published assets are immutable' }
          $assets = @(Get-ChildItem dist/release -File | Select-Object -ExpandProperty FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "ProjectDock $version" --notes-file "docs/releases/$($env:RELEASE_TAG).md"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
